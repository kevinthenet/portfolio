name: Continuous Integration (CI)
run-name: ${{ github.sha }}
on:
  push:
    paths:
      - '**.ts'
      - '**.js'
      - '**.tsx'
      - '**.jsx'
      - '**.astro'
      - 'src/content/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'tsconfig.json'
      - 'astro.config.mjs'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Run Lint checks
        run: pnpm lint:check
  astro-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Run Astro checks
        run: pnpm astro check
  cypress-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.10.0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Start up dev server and run Cypress test suite
        run: |
          pnpm dev --host localhost > /tmp/astro-dev.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4321/ > /dev/null 2>&1; then
              echo "Astro dev server is ready"
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "Astro dev server exited early" >&2
              cat /tmp/astro-dev.log >&2
              exit 1
            fi
            sleep 2
          done
          if ! curl -fsS http://localhost:4321/ > /dev/null 2>&1; then
            echo "Astro dev server did not become ready in time" >&2
            cat /tmp/astro-dev.log >&2
            exit 1
          fi
          pnpm test
